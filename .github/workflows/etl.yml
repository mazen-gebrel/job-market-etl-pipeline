name: Job Market ETL Pipeline

on:
  schedule:
    - cron: '0 8 * * 6'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas sqlalchemy

      - name: Run Extraction
        run: python extract.py
        
      - name: Run Transformation
        run: python transform.py
        
      - name: Run Loading
        run: python load.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action ETL Bot"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated data pipeline update"
          git push
